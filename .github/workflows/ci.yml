name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit + integration + contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Testcontainers uses the runner's Docker daemon. e2e-tests is skipped (no -Pe2e).
      # verify = surefire (integration tests, Pact consumer) + failsafe (Pact provider).
      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Fail if the committed pact file is stale
        run: git diff --exit-code -- contract-tests/pacts

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-build
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  e2e-and-load:
    name: E2E + resilience + k6 smoke (docker compose)
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build service jars
        run: mvn -B -ntp -q install -DskipTests

      - name: docker compose up
        run: docker compose up -d --build --wait

      - name: E2E event flow + resilience tests
        run: mvn -B -ntp test -pl e2e-tests -Pe2e

      - uses: grafana/setup-k6-action@v1

      - name: k6 smoke load (thresholds p95<300ms, errors<1%)
        run: k6 run -e PROFILE=smoke load-tests/orders-load.js

      - name: Consumer lag and time to drain
        run: load-tests/measure-drain.sh 120

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Upload k6 summary and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-and-load-results
          path: |
            load-tests/results/
            e2e-tests/target/surefire-reports/
          if-no-files-found: ignore

      - name: docker compose down
        if: always()
        run: docker compose down -v
